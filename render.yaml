# render.yaml — Free tier, no Docker.
services:
  - type: web
    name: fb-group-poster
    runtime: node
    rootDir: worker
    plan: free
    # PLAYWRIGHT_BROWSERS_PATH doit être exporté AVANT le install pour que
    # les binaires aillent dans le dossier de l'app (persistant entre build et runtime),
    # et pas dans /opt/render/.cache qui est volatile.
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/worker/.playwright-browsers npm ci && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/worker/.playwright-browsers npx playwright install chromium
    startCommand: node src/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # CRITIQUE : doit pointer vers le même chemin que celui utilisé au build
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/worker/.playwright-browsers
      - key: NODE_VERSION
        value: 20.18.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKER_SECRET
        generateValue: true
      - key: RELOGIN_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: HEADLESS
        value: "true"
      - key: TEST_MODE
        value: "true"
      - key: BROWSER_LOCALE
        value: "fr-FR"
      - key: SESSION_BUCKET
        value: "fb-sessions"
      - key: SESSION_OBJECT_KEY
        value: "state.json"
      - key: POLL_INTERVAL_MS
        value: "10000"
      - key: SLACK_WEBHOOK_URL
        sync: false
